# Case 1: Keep a negative resource affinity rule combined with negative node affinity rules,
#         where the effective (complemented) node sets leave enough nodes to separate the resources.
node-affinity: vm1-not-on-node1
	resources vm:1
	nodes node1
	affinity negative

node-affinity: vm2-not-on-node1
	resources vm:2
	nodes node1
	affinity negative

resource-affinity: vm1-vm2-must-be-kept-separate
	resources vm:1,vm:2
	affinity negative

# Case 2: Remove a negative resource affinity rule combined with negative node affinity rules,
#         where the effective (complemented) node sets restrict the resources to too few nodes.
node-affinity: vm3-not-on-node2-node3
	resources vm:3
	nodes node2,node3
	affinity negative

node-affinity: vm4-not-on-node2-node3
	resources vm:4
	nodes node2,node3
	affinity negative

resource-affinity: vm3-vm4-must-be-kept-separate
	resources vm:3,vm:4
	affinity negative
